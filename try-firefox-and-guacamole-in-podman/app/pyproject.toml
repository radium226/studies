[project]
name = "guac-tunnel"
version = "0.1.0"
description = "WebSocket <-> guacd bridge, replacing the Java Guacamole webapp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.51.0",
    "websockets>=13.0",
]

[project.scripts]
guac-tunnel = "guac_tunnel.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
