---
# WireGuard topology:
#
#            wg0 (10.0.0.1/24)
#   server  -------------------  client1 (10.0.0.2/24, wg0)
#     |
#     +----------------------    client2 (10.0.0.3/24, wg0)
#
# ONE shared wg0 on the server with both spokes as peers -- this scales to
# any number of spokes, unlike an earlier version of this study that gave
# the server one dedicated WireGuard interface per spoke (see git history
# / README for why, and why that doesn't scale). The tradeoff: WireGuard's
# cryptokey routing can only ever deliver a given destination to a single
# peer per interface, so it genuinely cannot forward a multicast mDNS
# packet to multiple peers on one shared interface. Instead of routing
# multicast through WireGuard at all, mdns-unicast-repeater (deployed
# on the server only) joins the multicast group as an ordinary local
# socket and re-sends every packet it sees as plain unicast UDP to each
# spoke's own address -- which WireGuard has never had any trouble with.
- hosts: all
  become: true

  tasks:
    - name: Install WireGuard and mDNS packages
      community.general.pacman:
        name:
          - wireguard-tools
          - avahi
          - nss-mdns
          - bind
        state: present
        update_cache: true

    - name: Ensure /etc/wireguard exists
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"

    # Leftover from an earlier version of this study, where the server had
    # one dedicated WireGuard interface per spoke instead of one shared
    # wg0. Both used ListenPort 51820, so if they're still running they'll
    # keep that UDP port bound and the new wg0 fails to start.
    - name: Remove the old per-spoke WireGuard interfaces, if present
      when: inventory_hostname == 'server'
      block:
        - name: Stop and disable wg-c1/wg-c2
          ansible.builtin.systemd_service:
            name: "wg-quick@{{ item }}"
            state: stopped
            enabled: false
          loop: [wg-c1, wg-c2]
          failed_when: false

        - name: Remove their config/key files
          ansible.builtin.file:
            path: "/etc/wireguard/{{ item }}"
            state: absent
          loop:
            - wg-c1.conf
            - wg-c2.conf
            - wg-c1.key
            - wg-c2.key

    # --- Key generation -----------------------------------------------
    # All key-generation/pubkey facts run before any templating task
    # below, so that cross-host hostvars lookups (e.g. hostvars['client1']
    # .wg_pubkey from the server) are always populated by the time
    # they're needed.

    - name: Generate this host's WireGuard keypair (wg0)
      when: inventory_hostname in ['server', 'client1', 'client2']
      block:
        - name: Generate private key if missing
          ansible.builtin.shell: |
            umask 077
            test -f /etc/wireguard/wg0.key || wg genkey > /etc/wireguard/wg0.key
          changed_when: false
          no_log: true

        - name: Read private key
          ansible.builtin.command: cat /etc/wireguard/wg0.key
          register: wg0_privkey_result
          changed_when: false
          no_log: true

        - name: Derive public key
          ansible.builtin.shell: "wg pubkey < /etc/wireguard/wg0.key"
          register: wg0_pubkey_result
          changed_when: false

        - name: Record wg0 keys as facts
          ansible.builtin.set_fact:
            wg_privkey: "{{ wg0_privkey_result.stdout }}"
            wg_pubkey: "{{ wg0_pubkey_result.stdout }}"

    # --- Interface config templating -----------------------------------

    # No more Table=off/manual-route juggling: since the server now has
    # only one WireGuard interface, there's no cross-interface multicast
    # route collision to work around any more, and none of the peers here
    # need multicast in their AllowedIPs at all -- see the file header.
    - name: Write wg0.conf (server)
      when: inventory_hostname == 'server'
      ansible.builtin.template:
        src: templates/wg-interface.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      vars:
        local_address: 10.0.0.1/24,fd00::1/64
        wg_private_key: "{{ wg_privkey }}"
        listen_port: 51820
        wg_dns_server: 10.0.0.1
        wg_dns_ipv4: 10.0.0.1
        wg_dns_ipv6: "fd00::1"
        peers:
          - pubkey: "{{ hostvars['client1'].wg_pubkey }}"
            allowed_ips: 10.0.0.2/32,fd00::2/128
          - pubkey: "{{ hostvars['client2'].wg_pubkey }}"
            allowed_ips: 10.0.0.3/32,fd00::3/128

    - name: Write wg0.conf (client1)
      when: inventory_hostname == 'client1'
      ansible.builtin.template:
        src: templates/wg-interface.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      vars:
        local_address: 10.0.0.2/24,fd00::2/64
        wg_private_key: "{{ wg_privkey }}"
        wg_dns_server: 10.0.0.1
        wg_dns_ipv4: 10.0.0.2
        wg_dns_ipv6: "fd00::2"
        peers:
          - pubkey: "{{ hostvars['server'].wg_pubkey }}"
            endpoint: "{{ hostvars['server'].ansible_host }}:51820"
            allowed_ips: "10.0.0.0/24,224.0.0.0/4,fd00::/64,ff02::fb/128"
            persistent_keepalive: 25

    - name: Write wg0.conf (client2)
      when: inventory_hostname == 'client2'
      ansible.builtin.template:
        src: templates/wg-interface.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      vars:
        local_address: 10.0.0.3/24,fd00::3/64
        wg_private_key: "{{ wg_privkey }}"
        wg_dns_server: 10.0.0.1
        wg_dns_ipv4: 10.0.0.3
        wg_dns_ipv6: "fd00::3"
        peers:
          - pubkey: "{{ hostvars['server'].wg_pubkey }}"
            endpoint: "{{ hostvars['server'].ansible_host }}:51820"
            allowed_ips: "10.0.0.0/24,224.0.0.0/4,fd00::/64,ff02::fb/128"
            persistent_keepalive: 25

    # --- Proof-of-concept: real dynamic DNS on the hub -------------------
    # Parallel to the avahi/mDNS setup, not a replacement for it: a BIND
    # server on the hub, with peers registering their own name/address
    # via genuine RFC 2136 dynamic updates (nsupdate) -- the actual
    # standard protocol, not a bespoke one. Open/unauthenticated updates:
    # fine for a lab POC, not something to do for real. See
    # wg-dns-register and the README.

    - name: Deploy named.conf
      when: inventory_hostname == 'server'
      ansible.builtin.template:
        src: templates/named.conf.j2
        dest: /etc/named.conf
        owner: root
        group: named
        mode: "0640"

    - name: Deploy the wg zone skeleton (SOA/NS only -- everything else is dynamic)
      when: inventory_hostname == 'server'
      ansible.builtin.template:
        src: templates/wg.zone.j2
        dest: /var/named/wg.zone
        owner: named
        group: named
        mode: "0644"
        force: false # don't clobber a zone file BIND has since rewritten with dynamic records

    - name: Deploy the reverse zone skeleton
      when: inventory_hostname == 'server'
      ansible.builtin.template:
        src: templates/db.10.0.0.zone.j2
        dest: /var/named/db.10.0.0
        owner: named
        group: named
        mode: "0644"
        force: false

    # named needs to bind to wg0's own address (10.0.0.1), so it must not
    # start before that interface exists -- a drop-in makes this true on
    # every boot, not just this one provisioning run.
    - name: Make named wait for wg0
      when: inventory_hostname == 'server'
      block:
        - name: Create the systemd drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/named.service.d
            state: directory
            mode: "0755"

        - name: Deploy the drop-in
          ansible.builtin.copy:
            src: files/named-wait-for-wg0.conf
            dest: /etc/systemd/system/named.service.d/override.conf
            mode: "0644"

    - name: Start and enable named
      when: inventory_hostname == 'server'
      ansible.builtin.systemd_service:
        name: named
        state: restarted
        enabled: true
        daemon_reload: true

    # Plain (non-templated) file: HOSTNAME, IPV4, IPV6 and DNS_SERVER are
    # all derived at runtime from wg0 itself (see the file header), so the
    # same script deploys unchanged to every peer.
    - name: Deploy the DNS self-registration script
      when: inventory_hostname in ['server', 'client1', 'client2']
      ansible.builtin.copy:
        src: files/wg-dns-register
        dest: /usr/local/bin/wg-dns-register
        mode: "0755"

    # --- Bring tunnels up ------------------------------------------------

    - name: Start and enable WireGuard
      when: inventory_hostname in ['server', 'client1', 'client2']
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        state: restarted
        enabled: true

    - name: Allow IPv4 + IPv6 forwarding on the server (routes client1 <-> client2)
      when: inventory_hostname == 'server'
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    # --- Unicast mDNS repeater (replaces avahi's reflector) --------------
    # See the file header for why: one shared wg0 with multiple peers
    # can't have WireGuard forward multicast to more than one of them, so
    # this repeats each mDNS packet as unicast instead, which scales to
    # any number of spokes without needing one WireGuard interface each.

    # Plain (non-templated) file -- config lives in the environment file
    # below instead, so this script is also plain, importable Python for
    # tests/test_repeater_unit.py to exercise directly, with no Jinja
    # rendering involved.
    - name: Deploy the unicast mDNS repeater script
      when: inventory_hostname == 'server'
      ansible.builtin.copy:
        src: files/mdns-unicast-repeater
        dest: /usr/local/bin/mdns-unicast-repeater
        mode: "0755"

    - name: Deploy the unicast mDNS repeater environment file
      when: inventory_hostname == 'server'
      ansible.builtin.template:
        src: templates/mdns-unicast-repeater.env.j2
        dest: /etc/mdns-unicast-repeater.env
        mode: "0644"
      vars:
        mdns_repeater_iface: wg0
        mdns_repeater_local_v4: 10.0.0.1
        mdns_repeater_peers_v4: [10.0.0.2, 10.0.0.3]
        mdns_repeater_peers_v6: ["fd00::2", "fd00::3"]

    - name: Deploy the unicast mDNS repeater systemd unit
      when: inventory_hostname == 'server'
      ansible.builtin.copy:
        src: files/mdns-unicast-repeater.service
        dest: /etc/systemd/system/mdns-unicast-repeater.service
        mode: "0644"

    - name: Start and enable the unicast mDNS repeater
      when: inventory_hostname == 'server'
      ansible.builtin.systemd_service:
        name: mdns-unicast-repeater
        state: restarted
        enabled: true
        daemon_reload: true

    # --- mDNS (avahi) ----------------------------------------------------

    # client1 and foreign both also sit on "foreign_lan", a second network
    # that has nothing to do with WireGuard (client1 is dual-homed, the
    # way a real laptop might be on WireGuard *and* a home/office LAN).
    # Vagrant/libvirt don't let us pick the guest's interface name for it in
    # advance, so find whichever interface actually has the IP we assigned.
    - name: Determine the foreign_lan interface name
      when: inventory_hostname in ['client1', 'foreign']
      ansible.builtin.shell: |
        ip -4 -o addr show | awk '$4 ~ "^{{ foreign_lan_ip }}/" {print $2; exit}'
      register: foreign_iface_result
      changed_when: false
      vars:
        foreign_lan_ip: "{{ '192.168.60.11' if inventory_hostname == 'client1' else '192.168.60.20' }}"

    - name: Record the foreign_lan interface name as a fact
      when: inventory_hostname in ['client1', 'foreign']
      ansible.builtin.set_fact:
        foreign_iface: "{{ foreign_iface_result.stdout }}"

    # client1's avahi handles two independent mDNS domains at once: wg0
    # (the WireGuard mesh) and foreign_lan (not bridged anywhere). foreign
    # only has the latter. No host runs avahi's own reflector any more --
    # mdns-unicast-repeater does that job on the server now instead
    # (see the file header), so every host here has exactly one relevant
    # mDNS domain and nothing to reflect between.
    - name: Configure avahi to only publish over the intended interfaces
      ansible.builtin.template:
        src: templates/avahi-daemon.conf.j2
        dest: /etc/avahi/avahi-daemon.conf
        mode: "0644"
      vars:
        # A ternary chain, not a dict literal: dict values are all built
        # eagerly before indexing, so 'foreign_iface' (only ever set on
        # client1/foreign) would blow up evaluating server/client2's
        # branch too. The ternary below only evaluates the branch actually
        # selected, same as Python's `a if cond else b`.
        avahi_allow_interfaces: >-
          {{
            ('wg0,' + foreign_iface) if inventory_hostname == 'client1'
            else foreign_iface if inventory_hostname == 'foreign'
            else 'wg0'
          }}
        avahi_enable_reflector: false

    - name: Advertise SSH over mDNS
      ansible.builtin.copy:
        src: files/avahi-ssh.service
        dest: /etc/avahi/services/ssh.service
        mode: "0644"

    # One fake (unbacked -- nothing is actually listening on these ports)
    # service per host, of a different type each, so avahi-browse across
    # the mesh shows real variety rather than 3 copies of the same thing.
    - name: Advertise a fake NAS service over mDNS
      when: inventory_hostname == 'server'
      ansible.builtin.copy:
        src: files/avahi-nas.service
        dest: /etc/avahi/services/nas.service
        mode: "0644"

    - name: Advertise a fake web app service over mDNS
      when: inventory_hostname == 'client1'
      ansible.builtin.copy:
        src: files/avahi-webapp.service
        dest: /etc/avahi/services/webapp.service
        mode: "0644"

    - name: Advertise a fake printer service over mDNS
      when: inventory_hostname == 'client2'
      ansible.builtin.copy:
        src: files/avahi-printer.service
        dest: /etc/avahi/services/printer.service
        mode: "0644"

    - name: Advertise a fake widget service over mDNS (foreign_lan only)
      when: inventory_hostname == 'foreign'
      ansible.builtin.copy:
        src: files/avahi-foreign-widget.service
        dest: /etc/avahi/services/widget.service
        mode: "0644"

    - name: Read current nsswitch hosts line
      ansible.builtin.command: grep '^hosts:' /etc/nsswitch.conf
      register: nsswitch_hosts_line
      changed_when: false

    # Two independent fixes to the box's stock hosts: line:
    # - The generic "mdns_minimal" module only resolves A (IPv4) records --
    #   real dual-stack NSS resolution needs the family-specific
    #   mdns4_minimal/mdns6_minimal modules instead (the standard nss-mdns
    #   convention).
    # - "resolve [!UNAVAIL=return]" stops the whole chain on ANY status
    #   other than UNAVAIL -- including a plain NOTFOUND, which is exactly
    #   what nss-resolve returns for .local names once resolved's own mDNS
    #   is disabled. That silently prevented mdns4_minimal/mdns6_minimal
    #   from ever being consulted at all. Dropping the override restores
    #   glibc's sane default action set (NOTFOUND/UNAVAIL both continue,
    #   only SUCCESS stops), so resolved still short-circuits for names it
    #   actually knows, but falls through to nss-mdns for everything else.
    - name: Enable IPv4 + IPv6 mDNS hostname resolution (nss-mdns) in nsswitch.conf
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^hosts:'
        line: >-
          {{ (nsswitch_hosts_line.stdout
              if 'mdns4_minimal' in nsswitch_hosts_line.stdout
              else nsswitch_hosts_line.stdout
                   | regex_replace('\bmdns_minimal \[NOTFOUND=return\] ', '')
                   | regex_replace('\bdns\b', 'mdns4_minimal [NOTFOUND=return] mdns6_minimal [NOTFOUND=return] dns'))
             | regex_replace('resolve \[!UNAVAIL=return\]', 'resolve') }}

    # systemd-resolved runs its own independent mDNS implementation
    # alongside avahi's (that's what avahi's "Detected another IPv4 mDNS
    # stack running on this host" startup warning meant). nsswitch's
    # "resolve" entry sits before mdns4_minimal/mdns6_minimal and stops the
    # chain on any non-UNAVAIL answer -- so whenever resolved's own mDNS
    # answers (even the wrong address family, which its legacy
    # gethostbyname2-style API doesn't request correctly, unlike its
    # getaddrinfo-style API), our nss-mdns modules never get consulted at
    # all. Disabling resolved's own mDNS lets "resolve" correctly step
    # aside for .local names and avahi/nss-mdns becomes the sole mDNS
    # implementation, as it should be.
    - name: Disable systemd-resolved's own mDNS (avahi is the sole mDNS implementation)
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?MulticastDNS='
        line: MulticastDNS=no
        insertafter: '^\[Resolve\]'

    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted

    - name: Start and enable avahi-daemon
      ansible.builtin.systemd_service:
        name: avahi-daemon
        state: restarted
        enabled: true
