---
# WireGuard topology:
#
#              wg-c1 (10.0.1.1/24)          wg0 (10.0.1.2/24)
#   server  ------------------------------  client1
#     |
#     |    wg-c2 (10.0.2.1/24)              wg0 (10.0.2.2/24)
#     +---------------------------------    client2
#
# server has TWO WireGuard interfaces (one dedicated point-to-point link
# per spoke) instead of one shared interface, because WireGuard's
# cryptokey routing can only ever deliver a given destination (including
# a multicast group like 224.0.0.251) to a single peer per interface.
# Giving each spoke its own interface lets avahi's reflector treat them as
# normal distinct network interfaces and repeat mDNS traffic between them.
- hosts: all
  become: true

  tasks:
    - name: Install WireGuard and mDNS packages
      community.general.pacman:
        name:
          - wireguard-tools
          - avahi
          - nss-mdns
        state: present
        update_cache: true

    - name: Ensure /etc/wireguard exists
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"

    # --- Key generation -----------------------------------------------
    # All key-generation/pubkey facts run before any templating task
    # below, so that cross-host hostvars lookups (e.g. hostvars['client1']
    # .wg_pubkey from the server) are always populated by the time
    # they're needed.

    - name: Generate server WireGuard keypairs (wg-c1, wg-c2)
      when: inventory_hostname == 'server'
      block:
        - name: Generate private keys if missing
          ansible.builtin.shell: |
            umask 077
            test -f /etc/wireguard/{{ item }}.key || wg genkey > /etc/wireguard/{{ item }}.key
          loop: [wg-c1, wg-c2]
          changed_when: false
          no_log: true

        - name: Read private keys
          ansible.builtin.command: cat /etc/wireguard/{{ item }}.key
          loop: [wg-c1, wg-c2]
          register: server_privkeys
          changed_when: false
          no_log: true

        - name: Derive public keys
          ansible.builtin.shell: "wg pubkey < /etc/wireguard/{{ item }}.key"
          loop: [wg-c1, wg-c2]
          register: server_pubkeys
          changed_when: false

        - name: Record wg-c1 keys as facts
          ansible.builtin.set_fact:
            wg_c1_privkey: "{{ server_privkeys.results[0].stdout }}"
            wg_c1_pubkey: "{{ server_pubkeys.results[0].stdout }}"

        - name: Record wg-c2 keys as facts
          ansible.builtin.set_fact:
            wg_c2_privkey: "{{ server_privkeys.results[1].stdout }}"
            wg_c2_pubkey: "{{ server_pubkeys.results[1].stdout }}"

    - name: Generate spoke WireGuard keypair (wg0)
      when: inventory_hostname in ['client1', 'client2']
      block:
        - name: Generate private key if missing
          ansible.builtin.shell: |
            umask 077
            test -f /etc/wireguard/wg0.key || wg genkey > /etc/wireguard/wg0.key
          changed_when: false
          no_log: true

        - name: Read private key
          ansible.builtin.command: cat /etc/wireguard/wg0.key
          register: spoke_privkey
          changed_when: false
          no_log: true

        - name: Derive public key
          ansible.builtin.shell: "wg pubkey < /etc/wireguard/wg0.key"
          register: spoke_pubkey
          changed_when: false

        - name: Record wg0 keys as facts
          ansible.builtin.set_fact:
            wg_privkey: "{{ spoke_privkey.stdout }}"
            wg_pubkey: "{{ spoke_pubkey.stdout }}"

    # --- Interface config templating -----------------------------------

    - name: Write wg-c1.conf (server side of the client1 tunnel)
      when: inventory_hostname == 'server'
      ansible.builtin.template:
        src: templates/wg-interface.conf.j2
        dest: /etc/wireguard/wg-c1.conf
        mode: "0600"
      vars:
        local_address: 10.0.1.1/24
        wg_private_key: "{{ wg_c1_privkey }}"
        listen_port: 51820
        peer_pubkey: "{{ hostvars['client1'].wg_pubkey }}"
        peer_allowed_ips: "10.0.1.2/32,224.0.0.0/4"
        disable_auto_routes: true
        peer_unicast_ip: 10.0.1.2/32

    - name: Write wg-c2.conf (server side of the client2 tunnel)
      when: inventory_hostname == 'server'
      ansible.builtin.template:
        src: templates/wg-interface.conf.j2
        dest: /etc/wireguard/wg-c2.conf
        mode: "0600"
      vars:
        local_address: 10.0.2.1/24
        wg_private_key: "{{ wg_c2_privkey }}"
        listen_port: 51821
        peer_pubkey: "{{ hostvars['client2'].wg_pubkey }}"
        peer_allowed_ips: "10.0.2.2/32,224.0.0.0/4"
        disable_auto_routes: true
        peer_unicast_ip: 10.0.2.2/32

    - name: Write wg0.conf (client1)
      when: inventory_hostname == 'client1'
      ansible.builtin.template:
        src: templates/wg-interface.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      vars:
        local_address: 10.0.1.2/24
        wg_private_key: "{{ wg_privkey }}"
        peer_pubkey: "{{ hostvars['server'].wg_c1_pubkey }}"
        peer_endpoint: "{{ hostvars['server'].ansible_host }}:51820"
        peer_allowed_ips: "10.0.0.0/16,224.0.0.0/4"
        persistent_keepalive: 25

    - name: Write wg0.conf (client2)
      when: inventory_hostname == 'client2'
      ansible.builtin.template:
        src: templates/wg-interface.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      vars:
        local_address: 10.0.2.2/24
        wg_private_key: "{{ wg_privkey }}"
        peer_pubkey: "{{ hostvars['server'].wg_c2_pubkey }}"
        peer_endpoint: "{{ hostvars['server'].ansible_host }}:51821"
        peer_allowed_ips: "10.0.0.0/16,224.0.0.0/4"
        persistent_keepalive: 25

    # --- Bring tunnels up ------------------------------------------------

    - name: Start and enable server WireGuard interfaces
      when: inventory_hostname == 'server'
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ item }}"
        state: restarted
        enabled: true
      loop: [wg-c1, wg-c2]

    - name: Start and enable spoke WireGuard interface
      when: inventory_hostname in ['client1', 'client2']
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        state: restarted
        enabled: true

    - name: Allow IPv4 forwarding on the server (routes client1 <-> client2)
      when: inventory_hostname == 'server'
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    # --- mDNS (avahi) ----------------------------------------------------

    # client1 and foreign both also sit on "foreign_lan", a second network
    # that has nothing to do with WireGuard (client1 is dual-homed, the
    # way a real laptop might be on WireGuard *and* a home/office LAN).
    # Vagrant/libvirt don't let us pick the guest's interface name for it in
    # advance, so find whichever interface actually has the IP we assigned.
    - name: Determine the foreign_lan interface name
      when: inventory_hostname in ['client1', 'foreign']
      ansible.builtin.shell: |
        ip -4 -o addr show | awk '$4 ~ "^{{ foreign_lan_ip }}/" {print $2; exit}'
      register: foreign_iface_result
      changed_when: false
      vars:
        foreign_lan_ip: "{{ '192.168.60.11' if inventory_hostname == 'client1' else '192.168.60.20' }}"

    - name: Record the foreign_lan interface name as a fact
      when: inventory_hostname in ['client1', 'foreign']
      ansible.builtin.set_fact:
        foreign_iface: "{{ foreign_iface_result.stdout }}"

    # client1's avahi handles two independent mDNS domains at once: wg0
    # (bridged into the mesh via the hub's reflector) and foreign_lan (not
    # bridged anywhere -- enable-reflector is only ever true on the hub, so
    # the two domains never mix). foreign only has the latter.
    - name: Configure avahi to only reflect/publish over the intended interfaces
      ansible.builtin.template:
        src: templates/avahi-daemon.conf.j2
        dest: /etc/avahi/avahi-daemon.conf
        mode: "0644"
      vars:
        # A ternary chain, not a dict literal: dict values are all built
        # eagerly before indexing, so 'foreign_iface' (only ever set on
        # client1/foreign) would blow up evaluating server/client2's
        # branch too. The ternary below only evaluates the branch actually
        # selected, same as Python's `a if cond else b`.
        avahi_allow_interfaces: >-
          {{
            'wg-c1,wg-c2' if inventory_hostname == 'server'
            else ('wg0,' + foreign_iface) if inventory_hostname == 'client1'
            else 'wg0' if inventory_hostname == 'client2'
            else foreign_iface
          }}
        avahi_enable_reflector: "{{ inventory_hostname == 'server' }}"

    - name: Advertise SSH over mDNS
      ansible.builtin.copy:
        src: files/avahi-ssh.service
        dest: /etc/avahi/services/ssh.service
        mode: "0644"

    # One fake (unbacked -- nothing is actually listening on these ports)
    # service per host, of a different type each, so avahi-browse across
    # the mesh shows real variety rather than 3 copies of the same thing.
    - name: Advertise a fake NAS service over mDNS
      when: inventory_hostname == 'server'
      ansible.builtin.copy:
        src: files/avahi-nas.service
        dest: /etc/avahi/services/nas.service
        mode: "0644"

    - name: Advertise a fake web app service over mDNS
      when: inventory_hostname == 'client1'
      ansible.builtin.copy:
        src: files/avahi-webapp.service
        dest: /etc/avahi/services/webapp.service
        mode: "0644"

    - name: Advertise a fake printer service over mDNS
      when: inventory_hostname == 'client2'
      ansible.builtin.copy:
        src: files/avahi-printer.service
        dest: /etc/avahi/services/printer.service
        mode: "0644"

    - name: Advertise a fake widget service over mDNS (foreign_lan only)
      when: inventory_hostname == 'foreign'
      ansible.builtin.copy:
        src: files/avahi-foreign-widget.service
        dest: /etc/avahi/services/widget.service
        mode: "0644"

    - name: Read current nsswitch hosts line
      ansible.builtin.command: grep '^hosts:' /etc/nsswitch.conf
      register: nsswitch_hosts_line
      changed_when: false

    - name: Enable mDNS hostname resolution (nss-mdns) in nsswitch.conf
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^hosts:'
        line: >-
          {{ nsswitch_hosts_line.stdout
             if 'mdns_minimal' in nsswitch_hosts_line.stdout
             else nsswitch_hosts_line.stdout | regex_replace('\bdns\b', 'mdns_minimal [NOTFOUND=return] dns') }}

    - name: Start and enable avahi-daemon
      ansible.builtin.systemd_service:
        name: avahi-daemon
        state: restarted
        enabled: true
