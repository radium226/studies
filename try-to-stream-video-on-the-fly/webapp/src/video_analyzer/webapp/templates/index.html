<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>video-analyzer-webapp</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-layout">
  <div id="tracks-column" class="tracks-column"></div>
  <div class="player-wrap">
    <video id="player" autoplay muted playsinline></video>
    <div id="progress-bar" class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
    <form id="source-form" class="source-form">
      <div class="source-form-row">
        <label><input type="radio" name="source-kind" id="source-kind-file" checked /> File</label>
        <label><input type="radio" name="source-kind" id="source-kind-url" /> URL</label>
      </div>
      <div id="source-kind-file-row" class="source-form-row">
        <span id="selected-file" class="selected-file">No file selected</span>
        <button id="source-browse" type="button">Choose file…</button>
      </div>
      <div id="source-kind-url-row" class="source-form-row" hidden>
        <input id="source-url" type="text" placeholder="https://…" class="source-url-input" />
      </div>
      <div class="source-form-row">
        <label class="form-field">
          speed factor <input id="speed-factor" type="number" min="0.01" step="any" value="1.0" />
        </label>
      </div>
      <div class="source-form-row">
        <label class="stop-strategy">
          <input id="stop-after-frame-count-enabled" type="checkbox" />
          stop after <input id="stop-after-frame-count-max-frames" type="number" min="1" value="300" /> frames
        </label>
      </div>
      <div class="source-form-row">
        <label class="stop-strategy">
          <input id="stop-on-first-track-enabled" type="checkbox" />
          stop once a track reaches <input id="stop-on-first-track-min-frames" type="number" min="1" value="1" /> frames
        </label>
      </div>
      <div class="source-form-row">
        <button type="submit">Load</button>
        <button id="source-stop" type="button">Stop</button>
      </div>
    </form>
    <div id="source-error" class="source-error" hidden>
      <div class="source-error-header">
        <span class="source-error-title">source failed</span>
        <button id="source-error-close" type="button" aria-label="Dismiss">&times;</button>
      </div>
      <pre id="source-error-text"></pre>
    </div>
    <p id="status"></p>
  </div>
  </div>
  <div id="browse-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <input id="browse-path" type="text" class="modal-path" autocomplete="off" />
        <button id="browse-up" type="button" title="Up one level">&uarr;</button>
        <button id="browse-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="browse-error" class="modal-error" hidden></div>
      <ul id="browse-entries" class="modal-entries"></ul>
    </div>
  </div>
  <script src="/static/live-stream.js"></script>
  <script src="/static/player.js"></script>
  <script src="/static/browse-modal.js"></script>
  <script src="/static/source.js"></script>
  <script src="/static/tracks.js"></script>
</body>
</html>
