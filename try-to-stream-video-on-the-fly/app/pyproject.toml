[project]
name = "video-streamer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
    "onnxruntime>=1.18.0",
    "scipy>=1.14",
    "supervision>=0.25.0",
    "trackers>=2.4.0",
]

[project.scripts]
video-streamer = "video_streamer.app:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
